<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Terminal cat watching the logs</title>
  <desc id="desc">An animated neon terminal with an ASCII cat and a current focus log.</desc>

  <defs>
    <linearGradient id="catBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0d1522"/>
      <stop offset="1" stop-color="#101c2c"/>
    </linearGradient>
    <linearGradient id="catBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8b949e" opacity="0.05"/>
    </pattern>
    <filter id="catGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="238" rx="20" fill="url(#catBackground)" stroke="url(#catBorder)" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="238" rx="20" fill="url(#scanlines)"/>

  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="500" y="33" text-anchor="middle" fill="#8b949e" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">tail -f /var/log/current-focus.log</text>
  <line x1="1" y1="52" x2="999" y2="52" stroke="#30363d"/>

  <g fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" filter="url(#catGlow)">
    <text x="92" y="103"> /&#92;_/&#92;</text>
    <text x="92" y="137">( o.o )</text>
    <text x="92" y="171"> &gt; ^ &lt;</text>
    <animate attributeName="opacity" values="1;1;0.78;1;1" keyTimes="0;0.45;0.48;0.51;1" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">
    <text x="330" y="91" fill="#58a6ff">gamid@lab:~$</text>
    <text x="475" y="91" fill="#c9d1d9">tail -f current-focus.log</text>

    <text x="330" y="126" fill="#58a6ff">[sys]</text>
    <text x="390" y="126" fill="#c9d1d9">linux administration</text>

    <text x="330" y="157" fill="#7ee787">[ctr]</text>
    <text x="390" y="157" fill="#c9d1d9">container workflows</text>

    <text x="330" y="188" fill="#f2cc60">[obs]</text>
    <text x="390" y="188" fill="#c9d1d9">monitoring &amp; automation</text>

    <rect x="665" y="175" width="10" height="17" rx="1" fill="#f2cc60">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="18" y="58" width="964" height="2" fill="#58a6ff" opacity="0.18">
    <animate attributeName="y" values="58;222;58" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="940" y="220" text-anchor="end" fill="#484f58" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">cat is watching the logs</text>
</svg>
