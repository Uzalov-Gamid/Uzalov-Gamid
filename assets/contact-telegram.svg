<svg xmlns="http://www.w3.org/2000/svg" width="300" height="64" viewBox="0 0 300 64" role="img" aria-labelledby="title">
  <title id="title">Telegram: @uzalovgamid</title>
  <defs>
    <linearGradient id="telegramLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="300" height="64" rx="10" fill="#0d1117"/>
  <rect y="62" width="300" height="2" fill="url(#telegramLine)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="16" y="24" fill="#7ee787" font-size="13">$</text>
    <text x="33" y="24" fill="#8b949e" font-size="13">open telegram</text>
    <text x="16" y="48" fill="#58a6ff" font-size="15">@uzalovgamid</text>
    <rect x="139" y="35" width="8" height="15" rx="1" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
