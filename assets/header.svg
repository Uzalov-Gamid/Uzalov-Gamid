<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Gamid Uzalov — Linux, automation and infrastructure</title>
  <desc id="desc">A terminal session showing Gamid Uzalov's current focus and learning path.</desc>

  <defs>
    <linearGradient id="headerBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0d1522"/>
      <stop offset="1" stop-color="#101c2c"/>
    </linearGradient>
    <linearGradient id="headerBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="headerScanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8b949e" opacity="0.04"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#headerBackground)" stroke="url(#headerBorder)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#headerScanlines)"/>

  <circle cx="31" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="51" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="71" cy="29" r="6" fill="#27c93f"/>
  <text x="600" y="34" text-anchor="middle" fill="#8b949e" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">profile.sh — gamid@github</text>
  <line x1="1" y1="55" x2="1199" y2="55" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="58" y="101" fill="#7ee787" font-size="17">gamid@github:~$ whoami</text>
    <text x="56" y="166" fill="#f0f6fc" font-size="54" font-weight="700" letter-spacing="1">GAMID UZALOV</text>
    <text x="58" y="205" fill="#58a6ff" font-size="23">Linux · automation · infrastructure</text>

    <text x="58" y="254" fill="#8b949e" font-size="14">location</text>
    <text x="150" y="254" fill="#c9d1d9" font-size="14">Moscow, RU</text>
    <text x="58" y="282" fill="#8b949e" font-size="14">status</text>
    <text x="150" y="282" fill="#7ee787" font-size="14">open to junior roles</text>

    <text x="824" y="94" fill="#8b949e" font-size="13" letter-spacing="1.8">PRACTICE PATH</text>
    <text x="824" y="132" fill="#58a6ff" font-size="15">01</text>
    <text x="865" y="132" fill="#c9d1d9" font-size="16">Python automation</text>
    <text x="824" y="174" fill="#7ee787" font-size="15">02</text>
    <text x="865" y="174" fill="#c9d1d9" font-size="16">Linux operations</text>
    <text x="824" y="216" fill="#d2a8ff" font-size="15">03</text>
    <text x="865" y="216" fill="#c9d1d9" font-size="16">Containers &amp; CI/CD</text>
    <text x="824" y="258" fill="#f2cc60" font-size="15">04</text>
    <text x="865" y="258" fill="#c9d1d9" font-size="16">Monitoring</text>

    <text x="824" y="295" fill="#58a6ff" font-size="14">gamid@github:~$</text>
    <rect x="980" y="282" width="10" height="17" rx="1" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="18" y="61" width="1164" height="2" fill="#58a6ff" opacity="0.12">
    <animate attributeName="y" values="61;310;61" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
