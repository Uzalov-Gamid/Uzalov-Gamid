<text x="32" y="258" fill="#d4d4d6" font-size="17">Начинал с Python-разработки, сейчас перехожу в администрирование Linux и DevOps.</text>
<text x="32" y="288" fill="#d4d4d6" font-size="17">Практику получаю в Школе 21 и на собственных лабораторных стендах.</text>
<text x="32" y="318" fill="#d4d4d6" font-size="17">Каждую задачу довожу до воспроизводимого проекта с CI.</text>
<text x="32" y="368" fill="#7a7a80" font-size="12" font-weight="600" letter-spacing="2">СТЕК</text>
