<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Live GitHub statistics for Uzalov-Gamid</title>
  <desc id="desc">A terminal showing public repositories, followers, stars, forks, latest push and languages.</desc>
  <defs>
