name: Update terminal profile metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/terminal-metrics.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate terminal metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: terminal
          filename: profile/terminal-metrics.svg
          base: header, metadata
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          config_timezone: Europe/Moscow
          config_animations: yes
          plugins_errors_fatal: yes
          committer_message: "chore: update terminal profile metrics"
